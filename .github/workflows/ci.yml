name: Graphics engine
on: [push, pull_request]
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      - run: npm run package:check
      - run: npm run demo
      - uses: actions/upload-artifact@v4
        with:
          name: graphics-evidence-${{ matrix.os }}-node-${{ matrix.node }}
          path: |
            examples/poster/renders/before.png
            examples/poster/renders/after.png
            examples/poster/renders/benchmark.json
            examples/landscape/renders/landscape.png
